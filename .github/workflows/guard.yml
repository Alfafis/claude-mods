name: guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Valid JSON
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json plugins/*/hooks/hooks.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "Invalid JSON: $f"; exit 1; }
          done

      - name: Marketplace pinned to commits
        run: |
          python3 - <<'PY'
          import json, re, sys
          bad = [p["name"] for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]
                 if not (isinstance(p["source"], dict) and re.fullmatch(r"[0-9a-f]{40}", p["source"].get("sha", "")))]
          if bad:
              print("plugins without a pinned sha:", ", ".join(bad)); sys.exit(1)
          PY

      - name: Secrets in the diff
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          range="HEAD"; [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && range="$base..HEAD"
          if git log -p --format= "$range" | grep -E '^\+' | grep -E -- '(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'; then
            echo "Possible secret in the diff"; exit 1
          fi

      - name: Sensitive surface (warning, needs manual review)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          [ -z "$base" ] && exit 0
          git diff "$base"..HEAD -- plugins .claude-plugin .github \
            | grep -E '^\+' | grep -n -E -- '(fetch\(|XMLHttpRequest|WebSocket|https?://|\$\.process|child_process|spawn\(|exec\(|eval\(|new Function|\.github/workflows|marketplace\.json)' \
            && echo "::warning::The PR touches network, process, eval, workflow or marketplace: review line by line." || true
