name: Idea or feature
description: Propose a change or a new mod
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: If it needs the network, an external process or access outside the project, say so here.
    validations:
      required: true
