name: Bug
description: Something does not work as expected
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [filetree, crew, meter, recall, marketplace]
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where it runs
      options: [Terminal, Desktop app (Code tab), VS Code, Other]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Plugin and Claude Code versions
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce and what you expected
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not paste credentials or session text. Vulnerabilities go through Private Vulnerability Reporting (SECURITY.md).
